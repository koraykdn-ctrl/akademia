<style>
  :root{
    --navy:#152C47; --navy2:#1E3A5F; --navy-light:#2E5C8A;
    --amber:#D9A441; --amber-dark:#C97A2B;
    --bg:#F6F7F9; --card:#FFFFFF; --border:#E4E7EC;
    --text:#1F2937; --muted:#6B7280;
    --green:#10B981; --green-bg:#ECFDF5; --green-text:#047857;
    --yellow:#E0A72A; --yellow-bg:#FFFBEB; --yellow-text:#B45309;
    --red:#DC4C4C; --red-bg:#FEF2F2; --red-text:#B91C1C;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  .app{display:flex;height:100vh;height:100dvh;overflow:hidden;}

  /* ---------- sidebar ---------- */
  .sidebar{width:280px;background:var(--navy);color:#fff;display:flex;flex-direction:column;flex-shrink:0;
    transition:transform .2s ease;z-index:40;position:fixed;top:0;left:0;height:100%;transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .sidebar-head{padding:22px 20px 16px;border-bottom:1px solid rgba(255,255,255,.1);}
  .brand{display:flex;align-items:center;gap:8px;}
  .brand-title{font-weight:700;font-size:15px;letter-spacing:-0.01em;}
  .brand-sub{font-size:11px;color:rgba(255,255,255,.5);}
  .btn-add{margin:16px 16px 0;display:flex;align-items:center;justify-content:center;gap:6px;
    background:var(--amber);color:var(--navy);font-weight:600;font-size:14px;border:none;border-radius:10px;padding:10px;width:calc(100% - 32px);}
  .btn-add:hover{background:#e6b660;}
  .btn-dashboard{margin:16px 16px 0;display:flex;align-items:center;justify-content:center;gap:6px;
    background:rgba(255,255,255,.08);color:#fff;font-weight:600;font-size:13.5px;border:1px solid rgba(255,255,255,.15);
    border-radius:10px;padding:9px;width:calc(100% - 32px);}
  .btn-dashboard:hover{background:rgba(255,255,255,.14);}
  .btn-dashboard.active{background:var(--amber);color:var(--navy);border-color:var(--amber);}
  .sidebar-search{position:relative;margin:12px 16px 0;}
  .sidebar-search input{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:8px;
    padding:7px 10px 7px 30px;font-size:12.5px;color:#fff;}
  .sidebar-search input::placeholder{color:rgba(255,255,255,.4);}
  .sidebar-search .search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.4);}
  .overdue-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#f87171;margin-left:4px;vertical-align:middle;}
  .student-list{flex:1;overflow-y:auto;padding:12px 8px;}
  .student-item{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;color:#fff;text-align:left;
    padding:9px 10px;border-radius:10px;margin-bottom:2px;}
  .student-item:hover{background:rgba(255,255,255,.06);}
  .student-item.active{background:rgba(255,255,255,.15);}
  .student-name{font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .student-meta{font-size:11px;color:rgba(255,255,255,.45);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .sidebar-foot{padding:10px 20px;font-size:10px;color:rgba(255,255,255,.3);border-top:1px solid rgba(255,255,255,.1);}
  .empty-students{color:rgba(255,255,255,.35);font-size:12px;text-align:center;padding:20px;}

  /* ---------- main ---------- */
  .main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
  .topbar{position:sticky;top:0;z-index:20;background:rgba(246,247,249,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--border);}
  .topbar-inner{max-width:920px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .menu-btn{display:inline-flex;background:none;border:none;padding:6px;margin-right:4px;color:#374151;}
  .title-name{font-size:18px;font-weight:700;letter-spacing:-0.01em;margin:0;}
  .title-sub{font-size:12px;color:var(--muted);}
  .content{max-width:920px;margin:0 auto;padding:0 20px 64px;}

  .tabs{display:flex;gap:4px;padding:16px 0 18px;overflow-x:auto;}
  .tab-btn{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;font-size:13.5px;font-weight:500;
    background:none;border:none;color:var(--muted);white-space:nowrap;}
  .tab-btn.active{background:var(--navy2);color:#fff;}
  .tab-btn:hover:not(.active){background:rgba(0,0,0,.04);}

  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.03);overflow:hidden;margin-bottom:16px;}
  .card-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid #F1F2F4;}
  .card-title{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14.5px;letter-spacing:-0.01em;}
  .card-body{padding:18px;}

  .btn-mini{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--navy2);
    background:rgba(30,58,95,.08);border:none;border-radius:8px;padding:6px 11px;}
  .btn-mini:hover{background:rgba(30,58,95,.14);}
  .btn-mini.whatsapp{color:#0d7a3f;background:rgba(37,211,102,.12);}
  .btn-mini.whatsapp:hover{background:rgba(37,211,102,.2);}
  .btn-mini.danger{color:#B91C1C;background:rgba(220,76,76,.1);}
  .btn-mini.danger:hover{background:rgba(220,76,76,.18);}
  .share-desc{font-size:12.5px;color:#6B7280;line-height:1.5;margin:0 0 12px;}
  .share-link-row{display:flex;gap:8px;}
  .share-link-input{flex:1;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12px;color:#4B5563;background:#F6F7F9;}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:640px){.grid2{grid-template-columns:1fr;}}
  .field label{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:4px;}
  .field input,.field select,.field textarea{width:100%;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13.5px;color:var(--text);background:#fff;}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--navy2);box-shadow:0 0 0 3px rgba(30,58,95,.12);}
  .field textarea{resize:vertical;min-height:44px;}

  .empty-msg{color:#9CA3AF;font-size:13px;text-align:center;padding:26px 0;}

  .global-appt-desc{font-size:12px;color:#6B7280;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .global-appt-status{font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:999px;flex-shrink:0;}
  .agenda-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #F1F2F4;}

  .agenda-desc{font-size:12.5px;color:#6B7280;flex:1;}
  .log-item-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
  .badge-num{background:var(--navy2);color:#fff;font-size:11px;font-weight:700;width:22px;height:22px;border-radius:50%;

  /* ---------- topics ---------- */

  .search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#9CA3AF;}
  .filter-select{border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13px;background:#fff;}
  .subject-chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 18px 18px;}

  /* ---------- deneme analizi ---------- */
  .exam-summary-title{font-size:12.5px;font-weight:600;color:#4B5563;margin-bottom:8px;}

  .exam-summary-count{font-weight:400;color:#9CA3AF;font-size:11px;}
  .weak-list{display:flex;flex-direction:column;gap:8px;}
  .weak-row{display:flex;align-items:center;gap:8px;}
  .weak-label{font-size:12px;color:#374151;width:120px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .weak-bar{flex:1;height:8px;border-radius:4px;background:#F1F2F4;overflow:hidden;}
  .weak-bar-fill{height:100%;border-radius:4px;transition:width .3s;}
  .weak-pct{font-size:11px;font-weight:700;color:#4B5563;width:34px;text-align:right;flex-shrink:0;}

  .exam-card{border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden;}
  .exam-card-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:11px 14px;background:var(--navy);cursor:pointer;user-select:none;}
  .exam-card-head .exam-name-input{flex:1;min-width:140px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:7px;padding:6px 10px;font-size:13px;font-weight:700;color:#fff;}
  .exam-card-head .exam-name-input::placeholder{color:rgba(255,255,255,.45);}
  .exam-card-head .exam-date-input{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:7px;padding:6px 8px;font-size:12.5px;color:#fff;width:130px;}
  .exam-card-head .exam-total-net{font-size:13px;font-weight:700;color:#7dd3fc;white-space:nowrap;}
  .exam-card-head .icon-btn{color:rgba(255,255,255,.6);padding:4px;}
  .exam-card-head .icon-btn:hover{color:#f87171;}
  .exam-card-toggle{margin-left:auto;font-size:12px;color:rgba(255,255,255,.6);transition:transform .2s;}
  .exam-card-toggle.open{transform:rotate(180deg);}
  .exam-card-body{padding:14px;display:none;}
  .exam-card-body.open{display:block;}
  .exam-name-input{flex:1;min-width:160px;border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:13px;font-weight:600;}
  .exam-date-input{border:1px solid var(--border);border-radius:8px;padding:7px 8px;font-size:12.5px;}
  .exam-total-net{font-size:12.5px;color:#4B5563;white-space:nowrap;}
  .exam-total-net strong{color:#1E3A5F;font-size:14px;}
  .exam-siralama-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;padding-bottom:10px;border-bottom:1px dashed var(--border);}
  .exam-siralama-label{font-size:11.5px;color:#6B7280;display:flex;align-items:center;gap:6px;}
  .exam-siralama-input{border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-size:12.5px;width:110px;}
  .siralama-badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;}
  .siralama-badge.ok{background:#ECFDF5;color:#047857;}
  .siralama-badge.bad{background:#FEF2F2;color:#B91C1C;}
  .siralama-badge.auto{background:#EEF2FF;color:#4338CA;}
  .siraref-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media(max-width:640px){ .siraref-grid{grid-template-columns:1fr;} }
  .siraref-title{font-size:12px;font-weight:700;color:#1F2937;margin-bottom:6px;}

  .siraref-row input{width:80px;border:1px solid var(--border);border-radius:6px;padding:5px 6px;font-size:12px;}
  .exam-sub-header{display:grid;grid-template-columns:1fr 50px 50px 50px 56px;gap:6px;padding:0 2px 4px;font-size:10px;font-weight:700;color:#9CA3AF;text-transform:uppercase;}
  .exam-sub-row{display:grid;grid-template-columns:1fr 50px 50px 50px 56px;gap:6px;align-items:center;padding:4px 2px;}
  .exam-sub-label{font-size:12.5px;color:#374151;}
  .exam-sub-max{color:#9CA3AF;font-size:11px;}
  .exam-num{width:100%;border:1px solid var(--border);border-radius:6px;padding:5px 4px;font-size:12.5px;text-align:center;}
  .exam-net{font-size:12.5px;font-weight:700;color:#1E3A5F;text-align:center;background:#F6F7F9;border-radius:6px;padding:5px 0;}
  @media(max-width:640px){
    .exam-sub-header{grid-template-columns:1fr 40px 40px 40px 46px;font-size:9px;}
    .exam-sub-row{grid-template-columns:1fr 40px 40px 40px 46px;}
    .exam-sub-label{font-size:11.5px;}

  .brans-block{border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px;}

  .brans-rows{margin-top:10px;display:flex;flex-direction:column;gap:6px;}
  .brans-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .brans-num-input{width:52px;border:1px solid var(--border);border-radius:6px;padding:5px 4px;font-size:12.5px;text-align:center;}
  .brans-net{font-size:12.5px;font-weight:700;color:#1E3A5F;background:#F6F7F9;border-radius:6px;padding:5px 10px;}

  /* ---------- kaynak takibi ---------- */
  .kaynak-subject-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle;}

  /* ---------- haftalık özet ---------- */
  .week-section-title{font-size:12.5px;font-weight:700;color:#1F2937;margin-bottom:8px;}
  .week-group{margin-bottom:12px;}
  .week-group-title{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px;margin-bottom:5px;}
  .week-group-title.tyt{background:rgba(46,92,138,.1);color:var(--navy-light);}
  .week-group-title.ayt{background:rgba(201,122,43,.1);color:var(--amber-dark);}
  .week-group-title.lgs{background:rgba(124,58,237,.1);color:#7C3AED;}
  .week-topic-list{margin:0;padding-left:18px;font-size:12.5px;color:#374151;}
  .week-topic-list li{margin-bottom:2px;}
  .week-topic-ana{color:#9CA3AF;font-size:11px;}

  .plan-row{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:8px;padding:8px 10px;}
  .plan-ders{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:6px;flex-shrink:0;}
  .plan-ders.tyt{background:rgba(46,92,138,.1);color:var(--navy-light);}
  .plan-ders.ayt{background:rgba(201,122,43,.1);color:var(--amber-dark);}
  .plan-ders.lgs{background:rgba(124,58,237,.1);color:#7C3AED;}
  .plan-konu{flex:1;font-size:12.5px;color:#374151;}

  /* ---------- ücret takibi ---------- */
  .odeme-list{display:flex;flex-direction:column;gap:6px;}

  .odeme-hafta{font-size:12.5px;font-weight:700;color:#1E3A5F;width:64px;flex-shrink:0;}

    .odeme-date-input{width:calc(50% - 12px);}

  .kaynak-subject-dot.tyt{background:var(--navy-light);}
  .kaynak-subject-dot.ayt{background:var(--amber-dark);}
  .kaynak-subject-dot.lgs{background:#7C3AED;}
  .kaynak-header-row{display:grid;grid-template-columns:1.6fr 1fr 0.9fr 0.9fr 1fr 32px;gap:6px;padding:0 2px 6px;font-size:10px;font-weight:700;color:#9CA3AF;text-transform:uppercase;}
  .kaynak-row{display:grid;grid-template-columns:1.6fr 1fr 0.9fr 0.9fr 1fr 32px;gap:6px;align-items:center;padding:5px 2px;border-top:1px solid #F1F2F4;}
  .kaynak-name-input,.kaynak-note-input{border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-size:12.5px;width:100%;}
  .kaynak-date-input{border:1px solid var(--border);border-radius:6px;padding:6px 4px;font-size:11.5px;width:100%;}
  @media(max-width:768px){
    .kaynak-header-row{display:none;}
    .kaynak-row{grid-template-columns:1fr;gap:6px;padding:10px 2px;}
  }

  .chip{font-size:11px;padding:4px 10px;border-radius:999px;border:1px solid;background:none;}
  .chip.tyt{border-color:rgba(46,92,138,.3);color:var(--navy-light);background:rgba(46,92,138,.05);}
  .chip.ayt{border-color:rgba(201,122,43,.3);color:var(--amber-dark);background:rgba(201,122,43,.05);}
  .chip.lgs{border-color:rgba(124,58,237,.3);color:#7C3AED;background:rgba(124,58,237,.05);}
  .chip.hidden{border-color:var(--border);color:#CBD5E1;background:#FAFAFA;text-decoration:line-through;}

  .subject-card{border-radius:16px;overflow:hidden;margin-bottom:12px;border:1px solid var(--border);}
  .subject-head{width:100%;display:flex;align-items:center;justify-content:space-between;padding:13px 18px;border:none;color:#fff;}
  .subject-head.tyt{background:var(--navy-light);}
  .subject-head.ayt{background:var(--amber-dark);}
  .subject-head.lgs{background:#7C3AED;}
  .subject-head-left{display:flex;align-items:center;gap:8px;}
  .subject-head-name{font-weight:600;font-size:13.5px;letter-spacing:-0.01em;}
  .subject-head-count{font-size:11px;color:rgba(255,255,255,.7);}
  .subject-head-right{display:flex;align-items:center;gap:8px;}

  .ana-konu-label{padding:9px 18px 4px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#9CA3AF;background:#FAFAFA;}

  .topic-row:hover{background:#FAFAFA;}
  .topic-text{font-size:13.5px;color:#374151;line-height:1.35;}
  .status-pills{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;flex-shrink:0;}

  .status-pill.active-bekliyor{background:#F1F2F4;color:#6B7280;}
  .status-pill.active-devam{background:var(--yellow-bg);color:var(--yellow-text);}
  .status-pill.active-tamam{background:var(--green-bg);color:var(--green-text);}

  .empty-state{display:flex;flex-direction:column;align-items:center;text-align:center;padding:90px 20px;}
  .empty-icon{width:56px;height:56px;border-radius:16px;background:rgba(30,58,95,.08);display:flex;align-items:center;justify-content:center;margin-bottom:16px;}
  .empty-title{font-size:16px;font-weight:700;color:#1F2937;}
  .empty-sub{font-size:13px;color:var(--muted);max-width:340px;margin-top:6px;}
  .btn-primary{margin-top:18px;display:flex;align-items:center;gap:6px;background:var(--navy2);color:#fff;font-weight:600;font-size:13.5px;
    border:none;border-radius:10px;padding:10px 18px;}

  /* ---------- ana sayfa (isim göstermez) ---------- */
  .home-wrap{display:flex;flex-direction:column;align-items:center;text-align:center;padding:70px 20px 40px;max-width:480px;margin:0 auto;}
  .home-icon{width:60px;height:60px;border-radius:18px;background:rgba(30,58,95,.08);display:flex;align-items:center;justify-content:center;margin-bottom:18px;}
  .home-title{font-size:20px;font-weight:800;color:#1F2937;letter-spacing:-0.01em;}

  .home-stat-card{flex:1;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;text-align:center;}

  .del-no{background:#F1F2F4;color:#4B5563;border:none;border-radius:8px;padding:6px 10px;}

  .modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;}

  .btn-primary-full{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;background:var(--navy2);color:#fff;

  }

  /* ---------- veli raporu (print) ---------- */
  #print-area{display:none;}
  .report-header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #152C47;padding-bottom:10px;margin-bottom:14px;}
  .report-brand{font-size:18px;font-weight:800;color:#152C47;}
  .report-sub{font-size:12px;color:#6B7280;}
  .report-date{font-size:12px;color:#6B7280;}
  .report-name{font-size:20px;font-weight:700;color:#1F2937;margin-top:4px;}
  .report-meta{font-size:12.5px;color:#6B7280;margin-bottom:16px;}
  .report-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px;}
  .report-box{border:1px solid #E4E7EC;border-radius:10px;padding:12px;text-align:center;}

  .report-footer{margin-top:24px;font-size:10px;color:#9CA3AF;text-align:center;}

function getAllowedSubjectsForStudent(student){
  const sinif = student && student.sinif;
  if(sinif === "7. Sınıf" || sinif === "8. Sınıf"){
    return LGS_SUBJECTS.slice(); // ortaokul öğrencisi: sadece LGS dersleri, TYT/AYT gösterilmez
  }
  const alan = student && student.alan;
  const aytAllowed = AYT_SUBJECTS_BY_ALAN[alan];
  const lisesDersleri = SUBJECT_ORDER.filter(s => !LGS_SUBJECTS.includes(s));
  if(!aytAllowed) return lisesDersleri; // alan seçilmemişse tüm lise dersleri açık kalsın
  return lisesDersleri.filter(s => isTYT(s) || aytAllowed.includes(s));
}

function getSiraRefPoints(key){
  const raw = state.siraReferans[key];

  if(raw.points && Array.isArray(raw.points)) return raw.points;
  // eski format: {net1, deger1, net2, deger2} → dönüştür
  const pts = [];
  if(raw.net1 && raw.deger1) pts.push({net: parseFloat(raw.net1), sira: parseFloat(raw.deger1)});
  if(raw.net2 && raw.deger2) pts.push({net: parseFloat(raw.net2), sira: parseFloat(raw.deger2)});
  return pts;
}

function migrateTopicIdsObject(topicsObj){
  if(!topicsObj || Object.keys(topicsObj).length===0) return topicsObj;
  const result = {};
  Object.keys(topicsObj).forEach(oldId=>{
    const newId = TOPIC_ID_MIGRATION_20260807[oldId] || oldId;
    const entry = topicsObj[oldId];
    const entryStatus = typeof entry === "string" ? entry : ((entry && entry.status) || "Yapılmadı");
    const entryDate = (entry && typeof entry === "object") ? (entry.date || "") : "";
    if(result[newId] !== undefined){
      const existing = result[newId];
      const existingStatus = typeof existing === "string" ? existing : ((existing && existing.status) || "Yapılmadı");
      const existingDate = (existing && typeof existing === "object") ? (existing.date || "") : "";
      const prioNew = STATUS_PRIORITY_MIG[entryStatus] || 0;
      const prioExisting = STATUS_PRIORITY_MIG[existingStatus] || 0;
      if(prioNew > prioExisting || (prioNew===prioExisting && entryDate > existingDate)){
        result[newId] = entry;
      }
    } else {
      result[newId] = entry;
    }
  });
  return result;
}

// fire-and-forget: push a single key/value up to Firestore
const cloudWriteQueues = {}; // key -> chained promise, so same-key writes never land out of order
function cloudSet(key, value){
  if(!cloudReady) return;
  const col = userDataCollection();
  if(!col) return;
  const payload = { value: JSON.stringify(value), updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
  const prev = cloudWriteQueues[key] || Promise.resolve();
  cloudWriteQueues[key] = prev
    .then(()=> col.doc(key).set(payload))
    .catch(e=> console.error("cloud sync (push) failed for", key, e));
}

  }
}

async function enableShareForStudent(studentId){
  if(!fbDb || !currentUser) return null;
  ensureStudentData(studentId);
  const s = state.students.find(x=>x.id===studentId);
  if(!s) return null;
  let token = s.shareToken;
  if(!token){
    token = genShareToken();
    updateStudent(studentId, { shareToken: token });
  }
  const payload = buildSharePayload(studentId);
  try{
    await fbDb.collection("publicShares").doc(token).set(payload);
  }catch(e){ console.error("share publish failed", e); }
  return token;
}

async function disableShareForStudent(studentId){
  const s = state.students.find(x=>x.id===studentId);
  if(!s || !s.shareToken) return;
  const token = s.shareToken;
  try{ await fbDb.collection("publicShares").doc(token).delete(); }catch(e){ console.error("share revoke failed", e); }
  updateStudent(studentId, { shareToken: "" });
}

// call after any save that could change a student's shared summary — no-op if sharing isn't on
function refreshShareIfActive(studentId){

}

// pull every doc from Firestore into localStorage (cloud -> local)
async function cloudPullAll(){
  const col = userDataCollection();
  if(!col) return 0;
  const snap = await col.get();
  snap.forEach(doc=>{
    const data = doc.data();
    if(data && typeof data.value === "string"){
      localStorage.setItem(LS_PREFIX + doc.id, data.value);
    }
  });
  return snap.size;
}

// push every local key up to Firestore (local -> cloud), used for first-time seeding
async function cloudPushAllLocal(){
  const col = userDataCollection();
  if(!col) return;
  const keys = Object.keys(localStorage).filter(k=>k.startsWith(LS_PREFIX));
  const batch = fbDb.batch();
  keys.forEach(k=>{
    const bareKey = k.slice(LS_PREFIX.length);
    const raw = localStorage.getItem(k);
    batch.set(col.doc(bareKey), { value: raw, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
  });
  if(keys.length>0) await batch.commit();
}

async function initialCloudSync(){
  try{
    const col = userDataCollection();
    if(!col) return;
    const snap = await col.limit(1).get();
    if(snap.empty){
      // cloud is empty — seed it from whatever is already on this device
      await cloudPushAllLocal();
    } else {
      // cloud already has data — pull it down (cloud wins, cross-device source of truth)
      await cloudPullAll();
    }
    cloudReady = true;
  }catch(e){
    console.error("initial cloud sync failed", e);
    cloudReady = true; // still allow app to work offline/local-only
  }
}

async function manualCloudRefresh(){
  try{
    const n = await cloudPullAll();
    location.reload();
  }catch(e){
    alert("Senkronizasyon başarısız oldu. İnternet bağlantını kontrol et.");
  }
}

// topics whose status is "Tamamlandı" AND whose "Son Çalışma Tarihi" falls within the last `days` days,
// grouped by ders (subject). Returns [{ders, items:[{anaKonu, konu, tarih}]}]
function getRecentlyCompletedTopics(studentId, days){
  days = days || 7;
  ensureStudentData(studentId);
  const d = state.cache[studentId];
  if(!d) return [];
  const student = state.students.find(s=>s.id===studentId);
  const allowedSubjects = getAllowedSubjectsForStudent(student);
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - days);
  const cutoffStr = cutoff.toISOString().slice(0,10);
  const bySubject = {};
  allowedSubjects.forEach(subj=>{
    SUBJECT_TOPICS[subj].forEach(t=>{
      const status = getTopicStatus(d.topics, t.id);
      const date = getTopicDate(d.topics, t.id);
      if(status === STATUS.TAMAM && date && date >= cutoffStr){
        if(!bySubject[subj]) bySubject[subj] = [];
        bySubject[subj].push({ anaKonu: t.anaKonu, konu: t.topic, tarih: date });
      }
    });
  });
  return allowedSubjects.filter(s=>bySubject[s]).map(s=>({ ders: s, items: bySubject[s] }));
}

// ALL topics currently marked "Tamamlandı", grouped by ders (no date filter — full history,
// including legacy entries saved before per-topic dates existed).
function getAllCompletedTopics(studentId){
  ensureStudentData(studentId);
  const d = state.cache[studentId];
  if(!d) return [];
  const bySubject = {};
  SUBJECT_ORDER.forEach(subj=>{
    SUBJECT_TOPICS[subj].forEach(t=>{
      if(getTopicStatus(d.topics, t.id) === STATUS.TAMAM){
        if(!bySubject[subj]) bySubject[subj] = [];
        bySubject[subj].push({ anaKonu: t.anaKonu, konu: t.topic });
      }
    });
  });
  return SUBJECT_ORDER.filter(s=>bySubject[s]).map(s=>({ ders: s, items: bySubject[s] }));
}

/* ---------------- backup / restore ---------------- */
function exportBackup(){
  const keys = Object.keys(localStorage).filter(k=>k.startsWith(LS_PREFIX));
  const data = {};
  keys.forEach(k=>{ data[k] = localStorage.getItem(k); });
  const payload = { app:"akademia-yks", version:1, exportedAt: new Date().toISOString(), data };
  const blob = new Blob([JSON.stringify(payload)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const dateStr = new Date().toISOString().slice(0,10);
  a.href = url; a.download = `akademia-yks-yedek-${dateStr}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  state.backupMsg = {type:"ok", text:"Yedek dosyası indirildi."};
  renderBackupModalInPlace();
}
function importBackupFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    let payload;
    try{ payload = JSON.parse(e.target.result); }
    catch(err){ state.backupMsg = {type:"err", text:"Dosya okunamadı: geçerli bir JSON değil."}; renderBackupModalInPlace(); return; }
    if(!payload || typeof payload.data !== "object"){
      state.backupMsg = {type:"err", text:"Bu dosya Akademia YKS yedek dosyası formatında değil."};
      renderBackupModalInPlace(); return;
    }
    const ok = window.confirm("Bu içe aktarma, cihazdaki mevcut TÜM öğrenci verilerinin üzerine yazacak. Devam edilsin mi?");
    if(!ok) return;
    Object.keys(localStorage).filter(k=>k.startsWith(LS_PREFIX)).forEach(k=>localStorage.removeItem(k));
    Object.entries(payload.data).forEach(([k,v])=>{ localStorage.setItem(k, v); });
    state.backupMsg = {type:"ok", text:"Yedek geri yüklendi. Uygulama yenileniyor…"};
    renderBackupModalInPlace();
    setTimeout(()=> location.reload(), 700);
  };
  reader.readAsText(file);
}

function cleanPhoneForWhatsApp(raw){
  let digits = String(raw||"").replace(/\D/g, "");
  if(!digits) return "";
  if(digits.startsWith("0")) digits = digits.slice(1);
  if(!digits.startsWith("90")) digits = "90" + digits;
  return digits;
}
function turkishDate(iso){
  if(!iso) return "—";
  const parts = iso.split("-");
  return parts.length===3 ? `${parts[2]}.${parts[1]}.${parts[0]}` : iso;
}
const TR_WEEKDAYS = ["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
const TR_MONTHS = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
function turkishDateLong(iso){
  if(!iso) return "—";
  const dt = new Date(iso + "T00:00:00");
  if(isNaN(dt.getTime())) return turkishDate(iso);
  return `${TR_WEEKDAYS[dt.getDay()]}, ${dt.getDate()} ${TR_MONTHS[dt.getMonth()]} ${dt.getFullYear()}`;
}

function getWeekStartMonday(iso){
  const dt = new Date(iso + "T00:00:00");
  if(isNaN(dt.getTime())) return iso;
  const day = dt.getDay(); // 0=Pazar..6=Cumartesi
  const diff = (day===0? -6 : 1) - day;
  const monday = new Date(dt);
  monday.setDate(dt.getDate() + diff);
  return monday.toISOString().slice(0,10);
}
function getPastAppointmentsGroupedByWeek(studentId){
  ensureStudentData(studentId);
  const d = state.cache[studentId];
  if(!d) return [];
  const today = nowISODate();
  const past = (d.appointments||[]).filter(a=> !(a.tarih>=today || a.durum==="Planlandı") && a.tarih);
  const byWeek = {};
  past.forEach(a=>{
    const ws = getWeekStartMonday(a.tarih);
    if(!byWeek[ws]) byWeek[ws] = [];
    byWeek[ws].push(a);
  });
  const weeks = Object.keys(byWeek).sort().reverse();
  return weeks.map(ws=>{
    const items = byWeek[ws].sort((a,b)=>(a.tarih+a.saat).localeCompare(b.tarih+b.saat));
    const startDt = new Date(ws + "T00:00:00");
    const endDt = new Date(startDt); endDt.setDate(startDt.getDate()+6);
    const label = `${startDt.getDate()} ${TR_MONTHS[startDt.getMonth()]} - ${endDt.getDate()} ${TR_MONTHS[endDt.getMonth()]}`;
    return { weekStart: ws, label, items };
  });
}

function buildDailyAgenda(){
  state.students.forEach(s=> ensureStudentData(s.id));
  const today = nowISODate();
  const items = [];
  state.students.forEach(s=>{
    const d = state.cache[s.id] || {appointments:[]};
    (d.appointments||[]).forEach(a=>{
      if(a.durum==="Planlandı" && a.tarih>=today){
        items.push({ tarih: a.tarih, saat: a.saat, aciklama: a.aciklama, label: s.name || "İsimsiz Öğrenci", kind: "student" });
      }
    });
  });
  state.generalAppointments.forEach(a=>{
    if(a.durum==="Planlandı" && a.tarih>=today){
      items.push({ tarih: a.tarih, saat: a.saat, aciklama: a.aciklama, label: "Kişisel", kind: "general" });
    }
  });
  items.sort((a,b)=>(a.tarih+a.saat).localeCompare(b.tarih+b.saat));
  const byDay = {};
  items.forEach(it=>{
    if(!byDay[it.tarih]) byDay[it.tarih] = [];
    byDay[it.tarih].push(it);
  });
  return Object.keys(byDay).sort().map(tarih=>({ tarih, items: byDay[tarih] }));
}

function buildStudentSummary(id){
  const s = state.students.find(x=>x.id===id);
  const d = state.cache[id] || {meetings:[], homework:[], topics:{}, hidden:[], exams:[]};
  const pct = s && s.total ? Math.round((s.completed/s.total)*100) : 0;
  const meetings = [...d.meetings].sort((a,b)=>(a.tarih||"").localeCompare(b.tarih||""));
  const lastMeeting = meetings[meetings.length-1] || null;
  const recentMeetings = [...meetings].reverse().slice(0,5);
  const homework = [...d.homework].sort((a,b)=>(a.tarih||"").localeCompare((b.tarih||"")));
  const recentHomework = [...d.homework].reverse().slice(0,5);
  const openHomeworkCount = d.homework.filter(h=>h.durum!=="Tamamlandı").length;
  const openHomeworkItems = [...d.homework].filter(h=>h.durum!=="Tamamlandı" && (h.odev||"").trim()).sort((a,b)=>(a.hafta||0)-(b.hafta||0)).reverse();
  const tytExams = d.exams.filter(e=>e.tur==="TYT");
  const aytExams = d.exams.filter(e=>e.tur==="AYT");
  const tytAvg = tytExams.length? tytExams.reduce((sum,e)=>sum+examTotalNet(e),0)/tytExams.length : null;
  const aytAvg = aytExams.length? aytExams.reduce((sum,e)=>sum+examTotalNet(e),0)/aytExams.length : null;
  const lastTyt = [...tytExams].sort((a,b)=>(a.tarih||"").localeCompare(b.tarih||"")).pop();
  const lastAyt = [...aytExams].sort((a,b)=>(a.tarih||"").localeCompare(b.tarih||"")).pop();
  const bransOzet = BRANS_TANIMLARI.map(bt=>{
    const items = (d.bransDenemeleri||[]).filter(x=>x.brans===bt.key).sort((a,b)=>(a.tarih||"").localeCompare(b.tarih||""));
    if(items.length===0) return null;
    const avg = items.reduce((s2,x)=>s2+calcNet(x.d,x.y),0) / items.length;
    const last = items[items.length-1];
    const lastNet = calcNet(last.d, last.y);
    const trend = items.length>1 ? (lastNet >= calcNet(items[0].d, items[0].y) ? "up" : "down") : null;
    return { brans: bt.key, avg, lastNet, count: items.length, trend, points: items.map((x,i)=>({v: calcNet(x.d,x.y), label: x.tarih? x.tarih.slice(5): "#"+(i+1)})) };
  }).filter(Boolean);
  return { s, d, pct, lastMeeting, recentMeetings, recentHomework, openHomeworkCount, openHomeworkItems, tytAvg, aytAvg, lastTyt, lastAyt, tytCount: tytExams.length, aytCount: aytExams.length, bransOzet };
}

    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#e5e7eb" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round" style="transition:stroke-dashoffset .4s"/>
    <text x="${size/2}" y="${size/2}" transform="rotate(90 ${size/2} ${size/2})" text-anchor="middle" dominant-baseline="central"
      font-size="${size*0.28}" font-weight="700" fill="#1e293b">${Math.round(pct)}</text>
  </svg>`;
}
function miniRingSVG(pct){
  const size=30, stroke=3.5, r=(size-stroke)/2, c=2*Math.PI*r, off=c-(pct/100)*c;
  const color = pct>=70? "#34d399" : pct>=35? "#fbbf24" : "#f87171";
  return `<svg width="${size}" height="${size}" style="transform:rotate(-90deg);flex-shrink:0">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round"/>
  </svg>`;
}

function isMeetingOverdue(s){
  if(!s.lastMeetingDate) return true; // never had a meeting
  const days = (Date.now() - new Date(s.lastMeetingDate).getTime()) / 86400000;
  return days > 9; // more than ~1 week + a bit of slack since last logged meeting
}

function renderGlobalAppointments(){
  state.students.forEach(s=> ensureStudentData(s.id));

  const upcomingStudentAppts = [];
  state.students.forEach(s=>{
    const d = state.cache[s.id] || {appointments:[]};
    (d.appointments||[]).forEach(a=>{
      const row = {...a, studentId: s.id, studentName: s.name || "İsimsiz Öğrenci"};

      else upcomingStudentAppts.push(row);

  });
  upcomingStudentAppts.sort((a,b)=>(a.tarih+a.saat).localeCompare(b.tarih+b.saat));

function subjectStats(topics){
  const stats = {};
  SUBJECT_ORDER.forEach(subj=>{
    const rows = SUBJECT_TOPICS[subj];
    let completed=0;
    rows.forEach(t=>{ if(getTopicStatus(topics, t.id)===STATUS.TAMAM) completed+=1; });
    stats[subj] = {total: rows.length, completed};
  });
  return stats;
}

  const opts = [[STATUS.BEKLIYOR,"Bekliyor","bekliyor"],[STATUS.DEVAM,"Devam","devam"],[STATUS.TAMAM,"Tamam","tamam"]];
  return `<div class="status-pills" data-tid="${topicId}">${opts.map(([val,label,cls])=>
    `<button class="status-pill ${status===val?'active-'+cls:''}" data-action="set-topic-status" data-value="${val}">${label}</button>`).join("")}</div>`;
}
function renderTopics(){
  const d = activeData();
  const s = activeStudent();

  let total=0, completed=0;
  allowedSubjects.forEach(subj=>{ if(d.hidden.includes(subj)) return; total+=stats[subj].total; completed+=stats[subj].completed; });
  const overallPct = total? (completed/total)*100 : 0;

  const chips = allowedSubjects.map(subj=>{
    const hid = d.hidden.includes(subj);
    const cls = hid? "hidden" : subjectBand(subj);
    return `<button class="chip ${cls}" data-action="toggle-hidden" data-subject="${esc(subj)}">${esc(subj)}</button>`;
  }).join("");

  const q = state.query.trim().toLocaleLowerCase("tr-TR");
  const subjectsHTML = allowedSubjects.filter(s2=>!d.hidden.includes(s2)).map(subject=>{
    let rows = SUBJECT_TOPICS[subject].filter(t=>{
      const st = getTopicStatus(d.topics, t.id);

      if(!q) return true;

    if((q || state.filterStatus!=="Tümü") && rows.length===0) return "";
    const st = stats[subject];
    const pct = st.total? (st.completed/st.total)*100 : 0;
    const isOpen = state.openSubjects.has(subject) || !!q || state.filterStatus!=="Tümü";
    let lastAna=null;
    const rowsHTML = rows.map(t=>{
      const status = getTopicStatus(d.topics, t.id);

      return `${showAna? `<div class="ana-konu-label">${esc(t.anaKonu)}</div>`:""}
        <div class="topic-row"><span class="topic-text">${esc(t.topic)}</span>${statusPillsHTML(t.id, status)}</div>`;
    }).join("");
    return `<div class="subject-card">

  return `

        </select>

      <div class="subject-chips">${chips}</div>

/* ---------------- render: deneme analizi ---------------- */
function lineChartSVG(points, opts){
  opts = opts || {};
  const w = opts.w || 640, h = opts.h || 140, pad = 28;
  if(points.length===0){
    return `<div class="empty-msg">Henüz veri yok.</div>`;
  }
  if(points.length===1){
    return `<div class="empty-msg">Trend grafiği için en az 2 deneme gerekir.</div>`;
  }
  const sign = opts.invert ? -1 : 1;
  const vals = points.map(p=>p.v*sign);
  const targetV = (opts.target!=null) ? opts.target*sign : null;
  let minV = Math.min(0, ...vals), maxV = Math.max(...vals, 1);
  if(targetV!=null){ minV = Math.min(minV, targetV); maxV = Math.max(maxV, targetV); }
  const range = (maxV - minV) || 1;
  const stepX = (w - pad*2) / (points.length - 1);
  const toY = (v) => h - pad - ((v - minV)/range) * (h - pad*2);
  const coords = points.map((p,i)=>{
    const x = pad + i*stepX;
    const y = toY(p.v*sign);
    return {x, y, v: p.v, label: p.label};
  });
  const path = coords.map((c,i)=> (i===0? "M":"L") + c.x.toFixed(1) + " " + c.y.toFixed(1)).join(" ");
  const dots = coords.map(c=> `<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="3.5" fill="#D9A441" stroke="#fff" stroke-width="1.5"/>`).join("");
  const labels = coords.map((c,i)=> i%Math.ceil(coords.length/6||1)===0 ? `<text x="${c.x.toFixed(1)}" y="${h-6}" font-size="9" fill="#9CA3AF" text-anchor="middle">${esc(c.label)}</text>` : "").join("");
  const targetLine = targetV!=null ? `<line x1="${pad}" y1="${toY(targetV).toFixed(1)}" x2="${w-pad}" y2="${toY(targetV).toFixed(1)}" stroke="#10b981" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="${w-pad}" y="${(toY(targetV)-4).toFixed(1)}" font-size="9" fill="#10b981" text-anchor="end">Hedef</text>` : "";
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px" preserveAspectRatio="none">
    <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="#E4E7EC" stroke-width="1"/>
    ${targetLine}
    <path d="${path}" fill="none" stroke="#1E3A5F" stroke-width="2.2"/>
    ${dots}${labels}
  </svg>`;
}

  const hedefSiralamaNum = s && s.hedefSiralama ? Number(String(s.hedefSiralama).replace(/[^\d]/g,"")) : null;

  const tytAvg = tytExams.length? (tytExams.reduce((s,e)=>s+examTotalNet(e),0)/tytExams.length) : 0;
  const aytAvg = aytExams.length? (aytExams.reduce((s,e)=>s+examTotalNet(e),0)/aytExams.length) : 0;

  const aytRefKey = aytRefKeyForStudent(s);
  const tytAvgSira = tytExams.length? estimateSiralamaBin("TYT", tytAvg) : null;
  // AYT: tüm 4 alan için sıralama hesapla
  const aytAlanSira = {};
  if(aytExams.length){
    AYT_ALAN_KEYS.forEach(k=>{ const v=estimateSiralamaBin(k,aytAvg); if(v!=null) aytAlanSira[k]=v; });
  }
  const aytAvgSira = (aytRefKey && aytAlanSira[aytRefKey]!=null) ? aytAlanSira[aytRefKey] : null;

  function subjectAverages(exams){
    if(exams.length===0) return [];
    const subs = examSubjects(exams[0]);
    return subs.map(sub=>{
      let totalNet=0, totalMax=sub.max;
      exams.forEach(e=>{
        const v=(e.subjects&&e.subjects[sub.key])||{};
        totalNet += calcNet(v.d,v.y);
      });
      const avgNet = totalNet/exams.length;
      return {label:sub.label, avgNet, max:sub.max, pct: Math.max(0, avgNet/sub.max*100)};
    }).sort((a,b)=>a.pct-b.pct);
  }
  const tytWeak = subjectAverages(tytExams);
  const aytWeak = subjectAverages(aytExams);

        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">

            <input type="text" inputmode="numeric" data-examfield="tahminiSiralama" value="${esc(exam.tahminiSiralama)}" placeholder="örn. 18.500" class="exam-siralama-input"/>

  }

  function weakListHTML(list){

function renderBransDenemeAnalizi(){
  const d = activeData();
  const bransOptions = BRANS_TANIMLARI.map(b=>`<option value="${esc(b.key)}">${esc(b.key)}</option>`).join("");

  const blocks = BRANS_TANIMLARI.map(bt=>{
    const items = d.bransDenemeleri.filter(x=>x.brans===bt.key).sort((a,b)=>(a.tarih||"").localeCompare(b.tarih||""));
    if(items.length===0) return "";
    const pts = items.map((x,i)=>({v: calcNet(x.d, x.y), label: x.tarih? x.tarih.slice(5): "#"+(i+1)}));
    const avg = items.reduce((s,x)=>s+calcNet(x.d,x.y),0) / items.length;
    const rows = [...items].reverse().map(x=>{
      const net = calcNet(x.d, x.y);
      return `<div class="brans-row" data-bid="${x.id}">
        <input type="date" data-bfield="tarih" value="${esc(x.tarih)}" class="exam-date-input"/>
        <input type="number" data-bfield="d" value="${esc(x.d)}" placeholder="D" min="0" max="${bt.max}" class="brans-num-input"/>
        <input type="number" data-bfield="y" value="${esc(x.y)}" placeholder="Y" min="0" max="${bt.max}" class="brans-num-input"/>
        <input type="number" data-bfield="b" value="${esc(x.b)}" placeholder="B" min="0" max="${bt.max}" class="brans-num-input"/>
        <span class="brans-net">${net.toFixed(2)} net</span>
        <button class="icon-btn" data-action="delete-brans-deneme">${svg('trash')}</button>
      </div>`;
    }).join("");
    const trend = items.length>1
      ? (calcNet(items[items.length-1].d, items[items.length-1].y) >= calcNet(items[0].d, items[0].y)
          ? `<span class="siralama-badge ok">↑ İlerleme</span>`
          : `<span class="siralama-badge bad">↓ Gerileme</span>`)
      : "";
    return `<div class="brans-block">
      <div class="brans-block-title">
        <span>${esc(bt.key)} <span class="exam-summary-count">(Ort. Net: ${avg.toFixed(2)}, ${items.length} deneme)</span> ${trend}</span>
        <button class="btn-mini" data-action="add-brans-deneme" data-brans="${esc(bt.key)}">${svg('plus')} Deneme Ekle</button>
      </div>
      ${lineChartSVG(pts, {w:600,h:110})}
      <div class="brans-rows">${rows}</div>
    </div>`;
  }).filter(Boolean).join("");

  return `<div class="card">
    <div class="card-head">
      <div class="card-title">🎯 Branş Deneme Analizi</div>
      <div style="display:flex;gap:8px;align-items:center">
        <select id="brans-select" class="filter-select">${bransOptions}</select>
        <button class="btn-mini" data-action="add-brans-deneme">${svg('plus')} Deneme Ekle</button>
      </div>
    </div>
    <div class="card-body">
      ${blocks || `<div class="empty-msg">Henüz branş denemesi eklenmedi. Yukarıdan bir ders seçip "Deneme Ekle"ye basarak başlayabilirsin. Bir branşta deneme birikince, o branşın kendi kutusundaki "Deneme Ekle" butonunu kullanabilirsin.</div>`}
    </div>
  </div>`;
}

/* ---------------- master render ---------------- */
/* ---------------- scroll + odak koruma ----------------
   render() tüm DOM'u (.main dahil) yeniden kurduğu için scroll sıfırlanıp
   odak kayboluyordu. Yeniden çizimden önce durumu saklayıp sonra geri veriyoruz. */
function __domPath(el){
  const app = document.getElementById("app");
  if(!el || !app || !app.contains(el)) return null;
  const parts = [];
  let node = el;
  while(node && node !== app){
    const parent = node.parentElement;
    if(!parent) return null;
    const idx = Array.prototype.indexOf.call(parent.children, node) + 1;
    parts.unshift("*:nth-child(" + idx + ")");
    node = parent;
  }
  return parts.length ? "#app > " + parts.join(" > ") : null;
}
function captureUIState(){
  const main = document.querySelector(".main");
  const scrollTop = main ? main.scrollTop : 0;
  const winScroll = window.scrollY || 0;
  const ae = document.activeElement;
  const sel = __domPath(ae);
  let selStart = null, selEnd = null;
  if(sel){ try{ selStart = ae.selectionStart; selEnd = ae.selectionEnd; }catch(e){} }
  return function(){
    const newMain = document.querySelector(".main");
    if(newMain && scrollTop) newMain.scrollTop = scrollTop;
    if(winScroll) window.scrollTo(0, winScroll);
    if(sel){
      const el = document.querySelector(sel);
      if(el && typeof el.focus === "function"){
        el.focus({preventScroll:true});
        if(selStart !== null){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
      }
    }
  };
}

function render(){
  const app = document.getElementById("app");
  const __restore = captureUIState();
  const s = activeStudent();
  const banner = storageWorks() ? "" : `<div class="storage-banner">⚠️ Bu tarayıcıda kalıcı depolama (localStorage) kullanılamıyor. Veriler yalnızca bu sekme açıkken saklanacak — verilerinizi kaybetmemek için tarayıcı ayarlarından "üçüncü taraf / site verilerini engelleme"yi kontrol edin.</div>`;

  let body = "";
  if(state.view==="home"){
    body = renderHomeScreen();
  } else if(state.view==="dashboard"){
    body = renderDashboard();
  } else if(state.view==="appointments"){
    body = renderGlobalAppointments();
  } else if(state.view==="payments"){
    body = renderPaymentsView();
  } else if(!s){
    body = renderEmptyState();
  }else{
    body = renderTabs();
    if(state.tab==="profil") body += renderProfile();
    else if(state.tab==="toplantilar") body += renderMeetings();
    // ödevler sekmesi kaldırıldı
    else if(state.tab==="konular") body += renderTopics();
    else if(state.tab==="kaynaklar") body += renderKaynaklar();
    else if(state.tab==="denemeler") body += renderExams();
  }

  app.innerHTML = `
    <div class="overlay ${state.sidebarOpen?'show':''}" data-action="close-sidebar"></div>
    <div class="app">
      ${renderSidebar()}
      <main class="main">
        ${renderTopbar()}
        ${banner}
        <div class="content">${body}</div>
      </main>
    </div>
    ${renderBackupModal()}
  `;
  attachEvents();
  __restore();
}

// lightweight in-place update for status pill clicks (avoids full re-render flashing on rapid taps)
function renderTopicRowInPlace(topicId, status){
  const wrap = document.querySelector(`.status-pills[data-tid="${topicId}"]`);
  if(!wrap) return false;
  wrap.outerHTML = statusPillsHTML(topicId, status);
  attachEvents(wrap.parentElement);
  // update subject header + overall stats without full rebuild
  updateHeaderStats();
  return true;
}
function updateHeaderStats(){
  // simplest reliable approach: re-render topics tab only if currently active
  if(state.tab==="konular"){
    const content = document.querySelector(".content");
    if(content){ content.innerHTML = renderTabs() + renderTopics(); attachEvents(content); }
  }
  renderTopbarInPlace();
}
function syncStudentDisplay(id){
  const s = state.students.find(s=>s.id===id); if(!s) return;
  const item = document.querySelector(`.student-item[data-id="${id}"]`);
  if(item){
    const nameEl = item.querySelector(".student-name");
    const metaEl = item.querySelector(".student-meta");
    if(nameEl) nameEl.textContent = s.name || "İsimsiz Öğrenci";
    if(metaEl) metaEl.textContent = (s.alan || "Alan belirtilmedi") + (s.hedefBolum? " · "+s.hedefBolum : "");
  }
  if(id===state.activeId){
    const titleEl = document.querySelector(".title-name");
    if(titleEl) titleEl.textContent = s.name || "İsimsiz Öğrenci";
  }
}
function renderTopbarInPlace(){
  const tb = document.querySelector(".topbar");
  if(tb){ tb.outerHTML = renderTopbar(); attachEvents(); }
}

/* ---------------- events (delegated) ---------------- */
function attachEvents(root){
  root = root || document;

  const actionTargets = Array.from(root.querySelectorAll("[data-action]"));
  if(root.matches && root.matches("[data-action]")) actionTargets.push(root);
  actionTargets.forEach(el=>{
    el.onclick = (e)=>{
      const action = el.dataset.action;
      if(action==="add-student") addStudent();
      else if(action==="select-student"){ state.activeId = el.dataset.id; state.view=el.dataset.view||"student"; state.tab=el.dataset.tab||"profil"; state.sidebarOpen=false; state.confirmDeleteStudent=false; state.activePlanWeek=null; render(); }
      else if(action==="open-home"){ state.view="home"; state.sidebarOpen=false; render(); }
      else if(action==="open-dashboard"){ state.view="dashboard"; state.sidebarOpen=false; render(); }
      else if(action==="open-appointments"){ state.view="appointments"; state.sidebarOpen=false; render(); }
      else if(action==="open-payments"){ state.view="payments"; state.sidebarOpen=true; render(); }
      else if(action==="add-odeme-haftasi"){ addOdemeHaftasi(el.dataset.sid); }
      else if(action==="toggle-odeme"){ toggleOdeme(el.dataset.sid, el.dataset.oid); }
      else if(action==="delete-odeme-haftasi"){ deleteOdemeHaftasi(el.dataset.sid, el.dataset.oid); }
      else if(action==="add-appointment") addAppointment();
      else if(action==="add-student-appointment"){
        const sel = document.getElementById("appt-student-select");
        if(sel && sel.value) addAppointmentForStudent(sel.value);
      }
      else if(action==="add-general-appointment") addGeneralAppointment();
      else if(action==="send-day-agenda"){ sendDayAgendaToSelf(el.dataset.tarih); }
      else if(action==="add-kaynak"){
        if(el.dataset.ders){
          addKaynak(el.dataset.ders);
        } else {
          const sel = document.getElementById("kaynak-ders-select");
          addKaynak(sel ? sel.value : null);
        }
      }
      else if(action==="delete-kaynak"){ const kid=el.closest("[data-kid]").dataset.kid; deleteKaynak(kid); }
      else if(action==="add-plan-item"){
        const dersSel = document.getElementById("plan-ders-select");
        const konuInput = document.getElementById("plan-konu-input");
        if(dersSel && konuInput && konuInput.value.trim()){
          addPlanItem(dersSel.value, konuInput.value);
          konuInput.value = "";
        }
      }
      else if(action==="delete-plan-item"){ const pid=el.closest("[data-planid]").dataset.planid; deletePlanItem(pid); }
      else if(action==="add-new-week"){ startNewPlanWeek(); }
      else if(action==="send-week-plan"){ sendWeekPlanToParent(); }
      else if(action==="delete-appointment"){
        const card = el.closest("[data-apptid]");
        if(card.dataset.general==="1") deleteGeneralAppointment(card.dataset.apptid);
        else deleteAppointment(card.dataset.apptid, card.dataset.sid);
      }
      else if(action==="open-sidebar"){ state.sidebarOpen=true; render(); }
      else if(action==="close-sidebar"){ state.sidebarOpen=false; render(); }
      else if(action==="set-tab"){ state.tab = el.dataset.tab; render(); }
      else if(action==="ask-delete-student"){ state.confirmDeleteStudent=true; renderTopbarInPlace(); }
      else if(action==="cancel-delete-student"){ state.confirmDeleteStudent=false; renderTopbarInPlace(); }
      else if(action==="confirm-delete-student"){ deleteStudent(state.activeId); }
      else if(action==="add-meeting") addMeeting();
      else if(action==="delete-meeting"){ const id=el.closest("[data-mid]").dataset.mid; deleteMeeting(id); }
      else if(action==="add-homework") addHomework();
      else if(action==="delete-homework"){ const id=el.closest("[data-hid]").dataset.hid; deleteHomework(id); }
      else if(action==="toggle-subject"){ const subj=el.dataset.subject; state.openSubjects.has(subj)?state.openSubjects.delete(subj):state.openSubjects.add(subj); render(); }
      else if(action==="toggle-hidden"){ toggleSubjectHidden(el.dataset.subject); }
      else if(action==="set-topic-status"){ const wrap=el.closest("[data-tid]"); setTopicStatus(wrap.dataset.tid, el.dataset.value); }
      else if(action==="open-backup") openBackupModal();
      else if(action==="cloud-refresh") manualCloudRefresh();
      else if(action==="sign-out"){ if(confirm("Çıkış yapmak istediğine emin misin?")) signOutApp(); }
      else if(action==="close-backup") closeBackupModal();
      else if(action==="export-backup") exportBackup();
      else if(action==="open-report") openReport();
      else if(action==="enable-share"){
        (async ()=>{
          await enableShareForStudent(state.activeId);
          render();
        })();
      }
      else if(action==="revoke-share"){
        if(confirm("Bu linki kapatırsan, elindeki linke sahip kişiler artık erişemez. Emin misin?")){
          (async ()=>{
            await disableShareForStudent(state.activeId);
            render();
          })();
        }
      }
      else if(action==="copy-share-link"){
        const input = document.getElementById("share-link-input");
        if(input){
          input.select();
          try{
            navigator.clipboard.writeText(input.value);
            el.textContent = "✓ Kopyalandı";
            setTimeout(()=>{ el.textContent = "📋 Kopyala"; }, 1500);
          }catch(err){
            document.execCommand("copy");
          }
        }
      }
      else if(action==="send-whatsapp") sendWhatsApp();
      else if(action==="send-whatsapp-student"){ (async ()=>{ await sendWhatsAppToStudent(); })(); }
      else if(action==="add-exam") addExam(el.dataset.tur);
      else if(action==="add-brans-deneme"){
        if(el.dataset.brans){
          addBransDeneme(el.dataset.brans);
        } else {
          const sel = document.getElementById("brans-select");
          if(sel && sel.value) addBransDeneme(sel.value);
        }
      }
      else if(action==="delete-brans-deneme"){ const bid=el.closest("[data-bid]").dataset.bid; deleteBransDeneme(bid); }
      else if(action==="delete-exam"){ const eid=el.closest("[data-examid]").dataset.examid; deleteExam(eid); }
      else if(action==="toggle-exam"){
        const eid = el.dataset.examid || el.closest("[data-examid]").dataset.examid;
        if(state.expandedExams.has(eid)) state.expandedExams.delete(eid);
        else state.expandedExams.add(eid);
        render();
      }
      else if(action==="delete-siraref"){
        const key=el.dataset.sirarefKey; const idx=parseInt(el.dataset.sirarefIdx,10);
        const pts=getSiraRefPoints(key).slice(); pts.splice(idx,1); saveSiraRefPoints(key,pts); render();
      }
    };
  });

  const importInput = root.querySelector("#import-file");
  if(importInput){ importInput.onchange = (e)=> importBackupFile(e.target.files[0]); }

  const coachPhoneEl = root.querySelector("#coach-phone-input");
  if(coachPhoneEl){
    coachPhoneEl.oninput = (e)=>{ saveCoachPhone(e.target.value); };
  }

  // çok noktalı sıralama referansı
  root.querySelectorAll("[data-siraref-key]").forEach(row=>{
    const key = row.dataset.sirarefKey;
    if(!key) return;
    const netEl  = row.querySelector(".siraref-net");
    const siraEl = row.querySelector(".siraref-sira");
    const idx    = parseInt(row.dataset.sirarefIdx, 10);
    function updateRow(){
      const pts = getSiraRefPoints(key).slice(); // kopyala
      const netVal  = netEl  ? netEl.value.trim()  : "";
      const siraVal = siraEl ? siraEl.value.trim() : "";
      if(netVal || siraVal){
        if(idx < pts.length){ pts[idx] = {net: netVal, sira: siraVal}; }
        else { pts.push({net: netVal, sira: siraVal}); }
      }
      saveSiraRefPoints(key, pts.filter(p=>(p.net||"").toString().trim() || (p.sira||"").toString().trim()));
      render();
    }
    if(netEl)  { netEl.onchange  = updateRow; }
    if(siraEl) { siraEl.onchange = updateRow; }
  });

  root.querySelectorAll("[data-odemefield]").forEach(el=>{
    const handler = ()=>{
      const row = el.closest("[data-oid]");
      if(row) updateOdeme(row.dataset.sid, row.dataset.oid, {[el.dataset.odemefield]: el.value});
    };
    el.oninput = handler;
    el.onchange = ()=>{ handler(); if(state.view==="payments") render(); };
  });

  root.querySelectorAll("[data-bfield]").forEach(el=>{
    const handler = ()=>{
      const row = el.closest("[data-bid]");
      if(row) updateBransDeneme(row.dataset.bid, {[el.dataset.bfield]: el.value});
    };
    el.onchange = ()=>{ handler(); render(); };
  });

  const sidebarSearchEl = root.querySelector("#sidebar-search-input");
  if(sidebarSearchEl){
    sidebarSearchEl.oninput = (e)=>{
      state.sidebarSearch = e.target.value;
      const list = document.querySelector(".student-list");
      const tmp = document.createElement("div");
      tmp.innerHTML = renderSidebar();
      const newList = tmp.querySelector(".student-list");
      if(list && newList){ list.innerHTML = newList.innerHTML; attachEvents(list); }
      const el = document.querySelector("#sidebar-search-input");
      if(el){ const v = el.value; el.focus(); el.setSelectionRange(v.length, v.length); }
    };
  }

  // profile fields
  root.querySelectorAll("[data-field]").forEach(el=>{
    const handler = ()=>{ updateStudent(state.activeId, {[el.dataset.field]: el.value}); syncStudentDisplay(state.activeId); };
    el.onchange = handler;
    if(el.tagName==="INPUT" || el.tagName==="TEXTAREA") el.oninput = handler;
  });

  // meeting fields
  root.querySelectorAll("[data-mfield]").forEach(el=>{
    const handler = ()=>{ const mid = el.closest("[data-mid]").dataset.mid; updateMeeting(mid, {[el.dataset.mfield]: el.value}); };
    el.onchange = handler;
    if(el.tagName==="INPUT" || el.tagName==="TEXTAREA") el.oninput = handler;
  });

  // homework fields
  root.querySelectorAll("[data-hfield]").forEach(el=>{
    const handler = ()=>{ const hid = el.closest("[data-hid]").dataset.hid; updateHomework(hid, {[el.dataset.hfield]: el.value}); };
    el.onchange = handler;
    if(el.tagName==="INPUT" || el.tagName==="TEXTAREA") el.oninput = handler;
  });

  // appointment (randevu) fields
  root.querySelectorAll("[data-apptfield]").forEach(el=>{
    const handler = ()=>{
      const card = el.closest("[data-apptid]");
      if(!card) return;
      if(card.dataset.general==="1") updateGeneralAppointment(card.dataset.apptid, {[el.dataset.apptfield]: el.value});
      else updateAppointment(card.dataset.apptid, {[el.dataset.apptfield]: el.value}, card.dataset.sid);
    };
    el.onchange = ()=>{ handler(); if(state.view==="appointments") render(); };
    if(el.tagName==="INPUT" || el.tagName==="SELECT") el.oninput = handler;
  });

  // kaynak takibi fields
  root.querySelectorAll("[data-kfield]").forEach(el=>{
    const handler = ()=>{
      const card = el.closest("[data-kid]");
      if(card) updateKaynak(card.dataset.kid, {[el.dataset.kfield]: el.value});
    };
    el.onchange = ()=>{ handler(); if(state.tab==="kaynaklar") render(); };
    if(el.tagName==="INPUT" || el.tagName==="SELECT") el.oninput = handler;
  });

  // exam fields (exam-level: ad/tarih on .exam-card; subject-level: d/y/b inside .exam-sub-row)
  root.querySelectorAll("[data-examfield]").forEach(el=>{
    const handler = ()=>{
      const subRow = el.closest("[data-subkey]");
      if(subRow){
        updateExamSubject(subRow.dataset.examid, subRow.dataset.subkey, el.dataset.examfield, el.value);
        const netEl = subRow.querySelector(".exam-net");
        if(netEl){
          const dEl = subRow.querySelector('[data-examfield="d"]');
          const yEl = subRow.querySelector('[data-examfield="y"]');
          netEl.textContent = calcNet(dEl.value, yEl.value).toFixed(2);
        }
        const card = el.closest("[data-examid].exam-card");
        const totalEl = card && card.querySelector(".exam-total-net strong");
        if(totalEl && card){
          const d = activeData();
          const exam = d.exams.find(e=>e.id===card.dataset.examid);
          if(exam) totalEl.textContent = examTotalNet(exam).toFixed(2);
        }
      } else {
        const card = el.closest("[data-examid]");
        if(card) updateExam(card.dataset.examid, {[el.dataset.examfield]: el.value});
      }
    };
    el.oninput = handler;
    el.onchange = ()=>{
      handler();
      // D / Y / B girişlerinde tam render YOK: net ve toplam net zaten yukarıda
      // yerinde güncelleniyor. Sadece sınav adı / tarihi değişince yeniden çiz.
      if(state.tab==="denemeler" && !el.closest("[data-subkey]")) render();
    };
  });

  // topic search / filter
  const searchEl = root.querySelector("#topic-search");
  if(searchEl){ searchEl.oninput = (e)=>{ state.query = e.target.value; const content=document.querySelector(".content"); content.innerHTML = renderTabs()+renderTopics(); attachEvents(content); searchEl2Focus(); }; }
  const filterEl = root.querySelector("#topic-filter");
  if(filterEl){ filterEl.onchange = (e)=>{ state.filterStatus = e.target.value; render(); }; }

  const planKonuEl = root.querySelector("#plan-konu-input");
  if(planKonuEl){
    planKonuEl.addEventListener("keydown", (e)=>{
      if(e.key==="Enter"){
        e.preventDefault();
        document.querySelector('[data-action="add-plan-item"]').click();
      }
    });
  }

  const activeWeekEl = root.querySelector("#active-week-select");
  if(activeWeekEl){
    activeWeekEl.onchange = (e)=>{ state.activePlanWeek = parseInt(e.target.value, 10); render(); };
  }

  const haftaBaslangicEl = root.querySelector("#hafta-baslangic-input");
  if(haftaBaslangicEl){
    haftaBaslangicEl.onchange = (e)=>{
      const id = state.activeId; if(!id) return;
      saveHaftaAraligi(id, getActivePlanWeek(id), { baslangic: e.target.value });
      render();
    };
  }
  const haftaBitisEl = root.querySelector("#hafta-bitis-input");
  if(haftaBitisEl){
    haftaBitisEl.onchange = (e)=>{
      const id = state.activeId; if(!id) return;
      saveHaftaAraligi(id, getActivePlanWeek(id), { bitis: e.target.value });
      render();
    };
  }
}
function searchEl2Focus(){
  const el = document.querySelector("#topic-search");
  if(el){ const v=el.value; el.focus(); el.setSelectionRange(v.length, v.length); }
}

/* ============================================================
   GİRİŞ EKRANI (Firebase Auth)
   ============================================================ */
let authMode = "login"; // "login" | "signup"
let authError = "";
let authBusy = false;

function authErrorMessage(code){
  const map = {
    "auth/invalid-email": "Geçersiz e-posta adresi.",
    "auth/user-not-found": "Bu e-posta ile kayıtlı bir hesap bulunamadı.",
    "auth/wrong-password": "Şifre hatalı.",
    "auth/invalid-credential": "E-posta veya şifre hatalı.",
    "auth/email-already-in-use": "Bu e-posta zaten kayıtlı — 'Giriş Yap' sekmesini kullan.",
    "auth/weak-password": "Şifre en az 6 karakter olmalı.",
    "auth/network-request-failed": "İnternet bağlantısı yok gibi görünüyor.",
    "auth/too-many-requests": "Çok fazla deneme yapıldı, biraz sonra tekrar dene.",
  };
  return map[code] || ("Bir hata oluştu: " + (code || "bilinmeyen hata"));
}

function renderAuthScreen(){
  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="auth-wrap">
      <div class="auth-card">
        <div class="auth-brand">🎓 Akademia YKS</div>
        <div class="auth-sub">Koçluk Takip Sistemi — Bulut Senkronizasyonu</div>
        <div class="auth-tabs">
          <button class="auth-tab ${authMode==='login'?'active':''}" data-authmode="login">Giriş Yap</button>
          <button class="auth-tab ${authMode==='signup'?'active':''}" data-authmode="signup">Hesap Oluştur</button>
        </div>
        <div class="field" style="margin-top:14px"><label>E-posta</label><input id="auth-email" type="email" placeholder="ornek@eposta.com" autocomplete="username"/></div>
        <div class="field" style="margin-top:10px"><label>Şifre</label><input id="auth-pass" type="password" placeholder="En az 6 karakter" autocomplete="current-password"/></div>
        ${authError? `<div class="auth-error">${esc(authError)}</div>` : ""}
        <button class="auth-submit" id="auth-submit-btn" ${authBusy?"disabled":""}>${authBusy? "Lütfen bekleyin…" : (authMode==='login'? "Giriş Yap":"Hesap Oluştur")}</button>
        ${authMode==='signup'? `<div class="auth-note">İlk kez mi kuruyorsun? Hesabı oluşturduktan sonra bu cihazdaki mevcut verilerin otomatik olarak buluta yüklenecek.</div>` : ""}
      </div>
    </div>
  `;
  document.querySelectorAll("[data-authmode]").forEach(b=>{
    b.onclick = ()=>{ authMode = b.dataset.authmode; authError=""; renderAuthScreen(); };
  });
  document.getElementById("auth-submit-btn").onclick = handleAuthSubmit;
  ["auth-email","auth-pass"].forEach(id=>{
    document.getElementById(id).addEventListener("keydown", (e)=>{ if(e.key==="Enter") handleAuthSubmit(); });
  });
}

async function handleAuthSubmit(){
  const emailEl = document.getElementById("auth-email");
  const passEl = document.getElementById("auth-pass");
  const email = emailEl.value.trim();
  const pass = passEl.value;
  if(!email || !pass){ authError = "E-posta ve şifre gerekli."; renderAuthScreen(); return; }
  authBusy = true; authError=""; renderAuthScreen();
  try{
    if(authMode==="signup"){
      await fbAuth.createUserWithEmailAndPassword(email, pass);
    } else {
      await fbAuth.signInWithEmailAndPassword(email, pass);
    }
    // onAuthStateChanged devralacak
  }catch(e){
    authBusy = false;
    authError = authErrorMessage(e.code);
    renderAuthScreen();
  }
}

function signOutApp(){
  if(fbAuth) fbAuth.signOut();
}

function renderLoadingScreen(msg){
  const app = document.getElementById("app");
  app.innerHTML = `<div class="auth-wrap"><div class="auth-loading">☁️ ${esc(msg||"Yükleniyor…")}</div></div>`;
}

async function manualCloudRefresh(){
  try{
    renderLoadingScreen("Senkronize ediliyor…");
    await cloudPullAll();
    location.reload();
  }catch(e){
    alert("Senkronizasyon başarısız oldu. İnternet bağlantını kontrol et.");
    render();
  }
}

function renderShareView(payload){
  const pct = payload.progressPct || 0;
  const app = document.getElementById("app");
  const tytChart = (payload.tytPoints && payload.tytPoints.length>0)
    ? lineChartSVG(payload.tytPoints.map(p=>({v:p.net, label: p.tarih? p.tarih.slice(5):""})), {h:110}) : "";
  const aytChart = (payload.aytPoints && payload.aytPoints.length>0)
    ? lineChartSVG(payload.aytPoints.map(p=>({v:p.net, label: p.tarih? p.tarih.slice(5):""})), {h:110}) : "";
  const bransOzet = payload.bransOzet || [];
  const bransChartsHTML = bransOzet.map(b=>`
    <div class="share-card">
      <div class="share-section-title">📊 ${esc(b.brans)}${b.avg!=null? ` (ort. ${b.avg})`:""}</div>
      ${lineChartSVG(b.points.map(p=>({v:p.net, label: p.tarih? p.tarih.slice(5):""})), {h:100})}
    </div>`).join("");
  const hwRows = (payload.openHomework||[]).map(h=>
    `<div class="share-hw-row"><span>${esc(h.odev)}</span><span class="share-hw-durum">${esc(h.durum)}</span></div>`
  ).join("") || `<div class="empty-msg">Açık ödev yok.</div>`;
  const upcoming = payload.upcomingAppointment;

  const meetings = payload.recentMeetings || [];
  const meetingsHTML = meetings.length
    ? meetings.map(m=>{
        const yapildiEtiket = m.yapildi==="Evet" ? "Yapıldı" : m.yapildi==="Ertelendi" ? "Ertelendi" : "Yapılmadı";
        return `<div class="share-meeting-row">
          <div class="share-meeting-head"><strong>${turkishDate(m.tarih)}</strong> <span class="share-meeting-durum">${esc(yapildiEtiket)}</span></div>
          ${m.konular? `<div class="share-meeting-field"><span>İşlenen Konular:</span> ${esc(m.konular)}</div>`:""}
          ${m.gozlem? `<div class="share-meeting-field"><span>Gözlem:</span> ${esc(m.gozlem)}</div>`:""}
          ${m.hedef? `<div class="share-meeting-field"><span>Sonraki Hedef:</span> ${esc(m.hedef)}</div>`:""}
        </div>`;
      }).join("")
    : `<div class="empty-msg">Henüz toplantı kaydı yok.</div>`;

  const completedGroups = payload.completedThisWeek || [];
  const completedHTML = completedGroups.length
    ? completedGroups.map(g=>`
        <div class="week-group">
          <div class="week-group-title ${subjectBand(g.ders)}">${esc(g.ders)}</div>
          <ul class="week-topic-list">${g.items.map(it=>`<li>${esc(it.konu)}</li>`).join("")}</ul>
        </div>`).join("")
    : `<div class="empty-msg">Son 7 günde tamamlanan konu yok.</div>`;

  const plan = payload.nextWeekPlan || [];
  const planHTML = plan.length
    ? plan.map(p=>`<div class="plan-row"><span class="plan-ders ${subjectBand(p.ders)}">${esc(p.ders)}</span><span class="plan-konu">${esc(p.konu)}</span></div>`).join("")
    : `<div class="empty-msg">Gelecek hafta için planlanmış konu yok.</div>`;

  app.innerHTML = `
    <div class="share-page">
      <div class="share-header">
        <div class="brand" style="justify-content:center">${svg('grad')}
          <div><div class="brand-title" style="color:#152C47">Akademia YKS</div><div class="brand-sub" style="color:#6B7280">Veli / Öğrenci Görünümü</div></div>
        </div>
      </div>
      <div class="share-card">
        <div class="share-student-name">${esc(payload.name)}</div>
        <div class="share-student-meta">${esc(payload.sinif)||""} ${payload.alan? "· "+esc(payload.alan):""} ${payload.hedefBolum? "· Hedef: "+esc(payload.hedefBolum):""}</div>
        <div class="share-progress-wrap">${progressRingSVG(pct, 64, 7)}
          <div><div class="share-progress-label">Konu İlerlemesi</div><div class="share-progress-pct">%${pct}</div></div>
        </div>
      </div>
      ${upcoming? `<div class="share-card"><div class="share-section-title">🗓️ Yaklaşan Randevu</div>
        <div class="share-appt">${turkishDate(upcoming.tarih)}${upcoming.saat? " - "+esc(upcoming.saat):""}${upcoming.aciklama? "<br>"+esc(upcoming.aciklama):""}</div></div>` : ""}
      <div class="share-card">
        <div class="share-section-title">👥 Son Toplantılar</div>
        ${meetingsHTML}
      </div>
      ${tytChart? `<div class="share-card"><div class="share-section-title">📊 TYT Net Gelişimi${payload.tytAvgNet!=null?` (ort. ${payload.tytAvgNet})`:""}</div>${tytChart}</div>` : ""}
      ${aytChart? `<div class="share-card"><div class="share-section-title">📊 AYT Net Gelişimi${payload.aytAvgNet!=null?` (ort. ${payload.aytAvgNet})`:""}</div>${aytChart}</div>` : ""}
      ${bransChartsHTML}
      <div class="share-card">
        <div class="share-section-title">✅ Bu Hafta Tamamlanan Konular</div>
        ${completedHTML}
      </div>
      <div class="share-card">
        <div class="share-section-title">📌 ${plan.length && plan[0].hafta? `Hafta ${plan[0].hafta} Ödevlendirmesi` : "Ödevlendirme"}</div>
        ${planHTML}
      </div>
      <div class="share-card">
        <div class="share-section-title">📋 Devam Eden Ödevler</div>
        ${hwRows}
      </div>
      <div class="share-footer">Bu sayfa Akademia YKS Koçluk Takip Sistemi tarafından otomatik oluşturulmuştur.</div>
    </div>
  `;
}

async function bootShareView(token){
  try{
    const doc = await fbDb.collection("publicShares").doc(token).get();
    if(!doc.exists){ renderShareNotFound(); return; }
    renderShareView(doc.data());
  }catch(e){
    console.error("share view load failed", e);
    renderShareNotFound();
  }
}

/* ---------------- boot ---------------- */
const __shareToken = getShareTokenFromURL();
if(__shareToken && fbDb){
  bootShareView(__shareToken);
} else if(fbAuth){
  fbAuth.onAuthStateChanged(async (user)=>{
    if(user){
      currentUser = user;
      renderLoadingScreen("Bulut ile senkronize ediliyor…");
      await initialCloudSync();
      runTopicMigrationIfNeeded();
      state = buildInitialState();
      render();
    } else {
      currentUser = null;
      cloudReady = false;
      authError = "";
      // Otomatik giriş: bilgiler doluysa giriş ekranını hiç gösterme.
      if(AUTO_LOGIN_EMAIL && AUTO_LOGIN_PASS && !__autoLoginTried){
        __autoLoginTried = true;
        renderLoadingScreen("Giriş yapılıyor…");
        try{
          await fbAuth.signInWithEmailAndPassword(AUTO_LOGIN_EMAIL, AUTO_LOGIN_PASS);
          return; // başarılı: onAuthStateChanged tekrar tetiklenip yukarıdaki dala girecek
        }catch(e){
          console.error("otomatik giriş başarısız", e);
          authError = "Otomatik giriş başarısız (" + (e && e.code ? e.code : e) + ") — bilgileri elle gir.";
        }
      }
      authMode = "login"; authBusy=false;
      renderAuthScreen();
    }
  });
} else {
  // Firebase yüklenemedi (örn. internet yok) — sadece bu cihazda çalışmaya devam et
  runTopicMigrationIfNeeded();
  state = buildInitialState();
  render();
}
</script>
</body>
</html>
